# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit の設定。レビュー対象のファイル数を上限(100)以内に収めるため、
# 人がレビューする必要のない生成物を除外する。
reviews:
  path_filters:
    # ---- テスト用フィクスチャ(生成物) ----
    # content/tests/fixtures/generate.py と content/scripts/export_json.py が決定論的に生成する。
    # 生成スクリプトの出力と一致することは content/tests/test_generated.py が CI で検証するため、
    # レビューは生成スクリプト側(generate.py / export_json.py)で行う。
    - "!content/tests/fixtures/valid/**"
    - "!content/tests/fixtures/invalid/**"
    - "!content/tests/fixtures/valid-json/**"
    # content/scripts/fsrs_vectors.py が py-fsrs から生成する(FSRSVectorTests が照合する)
    - "!packages/Domain/Tests/FSRSTests/Vectors/**"

    # ---- 学習コンテンツ(データ) ----
    # 構造と整合は Schema と validate.py(CI-01〜CI-12)が content-validate.yml で検証する
    - "!content/exams/**"

    # ---- テスト補助(テストからだけ使う部品とそのテスト) ----
    - "!packages/**/*TestSupport/**"
    - "!packages/**/*TestSupportTests/**"

    # ---- Xcode が自動生成・管理するファイル ----
    - "!**/xcuserdata/**"
    - "!**/*.xcodeproj/project.xcworkspace/**"
    # *.xcassets はアイコンや色の定義(Contents.json)を人が編集するため、除外しない
    - "!docs/reports/2026-10-22-implementation-report.md"
