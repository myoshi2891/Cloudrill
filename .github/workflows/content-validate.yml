name: content-validate

on:
  pull_request:
    paths:
      - "content/**"
      - "packages/DomainModels/**"
      - ".github/workflows/content-validate.yml"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "packages/DomainModels/**"
      - ".github/workflows/content-validate.yml"

permissions:
  contents: read

concurrency:
  group: content-validate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: content

jobs:
  python:
    name: pytest + validate.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: content
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        # --locked: uv.lock が pyproject.toml と食い違っていれば失敗させる
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q
      - name: Validate content
        # テストが失敗しても、コンテンツのアノテーションは出す
        if: success() || failure()
        run: uv run python scripts/validate.py --format github
