name: content-link-check

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: content

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: content/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check links
        # CI-06 は warning なので、--strict でリンク切れがあればジョブを失敗させる
        run: python scripts/validate.py --only CI-06 --check-links --strict --format github
