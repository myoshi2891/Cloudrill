name: content-link-check

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: content

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: content
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Check links
        # CI-06 は warning なので、--strict でリンク切れがあればジョブを失敗させる
        run: uv run python scripts/validate.py --only CI-06 --check-links --strict --format github
