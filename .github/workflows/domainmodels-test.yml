name: domainmodels-test

on:
  pull_request:
    paths:
      - "packages/DomainModels/**"
      - "content/schemas/**"
      - "content/tests/fixtures/**"
      - ".github/workflows/domainmodels-test.yml"
  push:
    branches: [main]
    paths:
      - "packages/DomainModels/**"
      - "content/schemas/**"
      - "content/tests/fixtures/**"
      - ".github/workflows/domainmodels-test.yml"

permissions:
  contents: read

concurrency:
  group: domainmodels-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Run Swift tests
        run: swift test --package-path packages/DomainModels
