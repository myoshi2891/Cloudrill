# validate.py の閾値・設定。コードを変更せずに調整できるよう、数値はすべてここに置く。
version: 1

examSet:
  # CI-02: status: complete の模試に求める条件(draft では warning)
  questionCount: 55
  # キーは対象ドメイン。"5+6" のように + で合算グループを指定できる
  domainDistribution:
    "1": 14
    "2": 10
    "3": 10
    "4": 8
    "5+6": 13
  caseQuestions:
    min: 12
    max: 15
  # 既定のケース割り当てと難易度(違反は warning)
  defaultAssignments:
    "1": { caseStudies: [ehr, altostrat], level: basic }
    "2": { caseStudies: [cymbal, knightMotives], level: basic }
    "3": { caseStudies: [ehr, cymbal], level: standard }
    "4": { caseStudies: [altostrat, knightMotives], level: standard }
    "5": { caseStudies: [ehr, knightMotives], level: advanced }
    "6": { caseStudies: [altostrat, cymbal], level: advanced }

statistics:
  # CI-03 / CI-04 で draft の模試を集計する最小問題数。これ未満の draft は統計チェックを省略する
  # (complete の模試は問題数にかかわらず常に検査する)
  draftMinSample: 20

answerPosition:
  # CI-03: 単一選択問題の正解位置(元の並び順)を先頭から何個分集計するか(4 = A〜D)
  positions: 4
  minRatio: 0.20
  maxRatio: 0.30

longestChoice:
  # CI-04: 「最長の選択肢(ja の文字数)が正解」の問題の割合の上限
  maxRatio: 0.35
  # true: 最長が同率で複数あり、その中に正解が含まれる場合も「最長が正解」と数える
  countTies: true

similarity:
  # CI-07: 問題文 stem.ja の文字 n-gram の Jaccard 係数がこの値を超える組を警告する
  ngram: 3
  jaccardThreshold: 0.8

weights:
  # CI-10
  expectedSum: 1.0
  tolerance: 0.001

links:
  # CI-06(--check-links 指定時のみ)
  timeoutSeconds: 10
  concurrency: 8
  userAgent: "examprep-content-link-check/1.0 (+https://github.com/)"
  retryWithGetOn: [405]

examGuide:
  version: "6.1"
  # CI-09: docs・問題・カードの subObjective はこの一覧に含まれること
  # 【暫定】公式試験ガイドとの照合が必要(README「前提と判断」参照)
  subObjectives:
    - "1.1"
    - "1.2"
    - "1.3"
    - "1.4"
    - "1.5"
    - "2.1"
    - "2.2"
    - "2.3"
    - "2.4"
    - "2.5"
    - "3.1"
    - "3.2"
    - "4.1"
    - "4.2"
    - "4.3"
    - "5.1"
    - "5.2"
    - "6.1"
    - "6.2"
    - "6.3"
    - "6.4"
    - "6.5"
    - "6.6"
