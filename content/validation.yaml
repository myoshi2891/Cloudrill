# validate.py の閾値・設定(全体)。コードを変更せずに調整できるよう、数値はすべてここに置く。
# 試験ごとの値は exams/<examID>/validation.yaml に書き、この内容に深いマージで重ねる
# (マッピングはキーごとにマージ、リストとスカラーは置き換え)。模試の構成(examSet)は試験ごとにだけ書ける。
# サブ項目・模試の問題数は exam.yaml が正。
version: 1

statistics:
  # CI-03 / CI-04 で draft の模試を集計する最小問題数。これ未満の draft は統計チェックを省略する
  # (complete の模試は問題数にかかわらず常に検査する)
  draftMinSample: 20

answerPosition:
  # CI-03: 単一選択問題の正解位置(元の並び順)を先頭から何個分集計するか(4 = A〜D)
  positions: 4
  minRatio: 0.20
  maxRatio: 0.30

longestChoice:
  # CI-04: 「最長の選択肢(ja の文字数)が正解」の問題の割合の上限
  maxRatio: 0.35
  # true: 最長が同率で複数あり、その中に正解が含まれる場合も「最長が正解」と数える
  countTies: true

similarity:
  # CI-07: 問題文 stem.ja の文字 n-gram の Jaccard 係数がこの値を超える組を警告する
  ngram: 3
  jaccardThreshold: 0.8

weights:
  # CI-10
  expectedSum: 1.0
  tolerance: 0.001

links:
  # CI-06(--check-links 指定時のみ)
  timeoutSeconds: 10
  concurrency: 8
  userAgent: "examprep-content-link-check/1.0 (+https://github.com/)"
  retryWithGetOn: [405]
