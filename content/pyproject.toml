[project]
name = "examprep-content"
version = "0.1.0"
description = "Cloudrill(クラウド認定試験対策アプリ)の学習コンテンツと検証ツール"
requires-python = ">=3.12"
# 直接依存はバージョンを固定する(更新は Dependabot の PR で行う)
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
# FSRS のテストベクタの生成用(開発時のみ。CI では使わない)。uv sync --project content --group fsrs で入れる
fsrs = ["fsrs==6.3.2"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests/fixtures"]
testpaths = ["tests"]
