[project]
name = "pca-content"
version = "0.1.0"
description = "PCA 試験対策アプリの学習コンテンツと検証ツール"
requires-python = ">=3.12"
# 直接依存はバージョンを固定する(更新は Dependabot の PR で行う)
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests/fixtures"]
testpaths = ["tests"]
