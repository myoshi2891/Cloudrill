name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest + validate.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Validate content
        # テストが失敗しても、コンテンツのアノテーションは出す
        if: success() || failure()
        run: python scripts/validate.py --format github

  swift:
    name: Swift DomainModels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Run Swift tests
        working-directory: swift/DomainModels
        run: swift test
